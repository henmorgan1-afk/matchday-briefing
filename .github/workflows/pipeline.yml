# Data pipeline (SPEC.md §1). Hourly at :15 UTC, plus a manual "Run workflow" button.
# P0: runs fetch-matches.js only. P1 switches this to run-pipeline.js and passes
# the optional match input through as --match <id>.
name: pipeline

on:
  schedule:
    - cron: '15 * * * *'        # every hour at :15, UTC
  workflow_dispatch:             # "Run workflow" button in the Actions tab
    inputs:
      match:
        description: 'Optional football-data.org match id'
        required: false

concurrency:
  group: pipeline
  cancel-in-progress: false     # never run two pipelines at once

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch teams and matches
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MATCH_ID: ${{ inputs.match }}
        run: |
          if [ -n "$MATCH_ID" ]; then
            echo "match input '$MATCH_ID' is ignored until P1 (run-pipeline.js); fetching all matches"
          fi
          node scripts/fetch-matches.js
