# Data + generation pipeline (SPEC.md §1, §3.1). Hourly at :15 UTC, plus a manual "Run workflow"
# button whose optional match input is passed on as --match <id>.
name: pipeline

on:
  schedule:
    - cron: '15 * * * *'        # every hour at :15, UTC
  workflow_dispatch:             # "Run workflow" button in the Actions tab
    inputs:
      match:
        description: 'Optional football-data.org match id'
        required: false

concurrency:
  group: pipeline
  cancel-in-progress: false     # never run two pipelines at once

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60                # the run starts no new match after 40 minutes (Revision 18)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch matches, generate and check comments
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # the second checker, on Groq's free plan (Revision 21)
          AI_PROVIDER: cloudflare         # Workers AI's free daily allowance (Revision 18)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MATCH_ID: ${{ inputs.match }}   # via env, never interpolated into the script
        run: |
          if [ -n "$MATCH_ID" ]; then
            node scripts/run-pipeline.js --match "$MATCH_ID"
          else
            node scripts/run-pipeline.js
          fi
