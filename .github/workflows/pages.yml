# Deploys frontend/ to GitHub Pages (SPEC.md §1). Runs on pushes to main that change the frontend,
# plus a manual "Run workflow" button for the first deploy. Repo Settings → Pages → Source must be
# "GitHub Actions", and the custom domain is set there too (no CNAME file in frontend/).
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false     # never cut off a deploy part-way

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stamp the service worker's CACHE_VERSION with this commit
        run: |
          version="${GITHUB_SHA::12}"
          sed -i "s/^const CACHE_VERSION = 'dev';\$/const CACHE_VERSION = '${version}';/" frontend/sw.js
          grep -qx "const CACHE_VERSION = '${version}';" frontend/sw.js || { echo "CACHE_VERSION line not found in frontend/sw.js"; exit 1; }
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend
          include-hidden-files: true   # v4+ drops dotfiles otherwise; §10 needs frontend/.well-known/
      - id: deployment
        uses: actions/deploy-pages@v5
