<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ludicrous Display</title>
  <meta name="description" content="Short talking points about your Premier League team's last match.">
  <meta name="theme-color" content="#0B0806">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Ludicrous">
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-state="loading">
  <header class="masthead">
    <p class="masthead__prompt" aria-hidden="true">C:\PREMIER_LEAGUE&gt; talking_points</p>
    <a class="masthead__title" href="./">Did you see that <em>ludicrous</em> display last <span class="masthead__end">night?<span class="cursor" aria-hidden="true"></span></span></a>
  </header>

  <main id="main" class="page" aria-live="polite">
    <p class="status">Loading…</p>
  </main>

  <!-- Pages with the team list only; app.js shows it (Revision 14). -->
  <div id="install" class="install" hidden>
    <div class="install__buttons">
      <button type="button" id="bookmark-button" class="install__button install__button--secondary">Bookmark</button>
      <button type="button" id="install-button" class="install__button">Install web app</button>
    </div>
    <p class="install__reassure">Free · No app store · Remove any time</p>
  </div>

  <!-- The Bookmark and install tips; app.js fills it and opens it with showModal() (Revision 15).
       The padding is on the inner div, so a click whose target is the dialog itself is on the backdrop. -->
  <dialog id="tip-dialog" class="tip-dialog" aria-labelledby="tip-dialog-title">
    <div class="tip-dialog__body">
      <h2 id="tip-dialog-title" class="tip-dialog__title"></h2>
      <p id="tip-dialog-text" class="tip-dialog__text"></p>
      <button type="button" id="tip-dialog-close" class="install__button tip-dialog__close" autofocus>Got it</button>
    </div>
  </dialog>

  <footer class="footer">
    <p id="footer-iphone">On iPhone: Share → Add to Home Screen</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => console.warn('Service worker not registered:', err));
      });
    }
  </script>
</body>
</html>
